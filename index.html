const svBand=v=>v==null?['#c9d2dc','—']:v<0.03?['#dc2626','Cold']:v<0.05?['#ea9a1a','Average']:['#16a34a','Strong'];
const money=p=>!p?'Price N/A':'$'+p.toLocaleString();
const sv=(a)=>'https://maps.googleapis.com/maps/api/streetview?size=600x360&location='+encodeURIComponent(a); // placeholder not used
function fallbackImg(el,addr){el.style.background="linear-gradient(135deg,#e8edf3,#d5dde6)";el.innerHTML+='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a97a6;font-size:12px;font-weight:600">No photo — <a style="margin-left:5px;color:#2563eb" target="_blank" href="https://www.google.com/maps?q='+encodeURIComponent(addr)+'&layer=c">Street View ↗</a></div>';}
let filter="all";
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const s=document.getElementById('sort').value;
 let rows=DATA.filter(r=>(filter==='all'||r.b===filter));
 if(q) rows=rows.filter(r=>(r.addr+' '+r.city+' '+(r.kws||[]).join(' ')).toLowerCase().includes(q));
 const ord={fresh:0,other:1,stale:2};
 const cmp={
  priority:(a,b)=>(ord[a.b]-ord[b.b])||((a.photos??99)-(b.photos??99))||((b.dom||0)-(a.dom||0)),
  photos:(a,b)=>(a.photos??99)-(b.photos??99),
  dom:(a,b)=>(b.dom||0)-(a.dom||0),
  sv:(a,b)=>((a.sv==null?9:a.sv)-(b.sv==null?9:b.sv)),
  price_lo:(a,b)=>((a.price||1e12)-(b.price||1e12)),
  price_hi:(a,b)=>((b.price||-1)-(a.price||-1)),
 }[s];
 rows.sort(cmp);
 document.getElementById('shown').textContent=rows.length;
 const g=document.getElementById('grid');g.innerHTML='';
 document.getElementById('empty').style.display=rows.length?'none':'block';
 for(const r of rows){
  const [mc,ml]=svBand(r.sv);
  const pw=(r.photos!=null&&r.photos<=3);
  const card=document.createElement('div');card.className='card';
  const facts=[];
  facts.push('<b>'+(r.beds??'—')+'</b> bd');
  facts.push('<b>'+(r.baths??'—')+'</b> ba');
  if(r.area) facts.push('<b>'+r.area.toLocaleString()+'</b> sqft');
  facts.push('<b>'+(r.dom??'—')+'</b> DOM');
  const kws=(r.kws||[]).slice(0,5).map(k=>'<span class="kw">'+k+'</span>').join('');
  const pct=r.sv==null?0:Math.min(100,Math.round(r.sv/0.06*100));
  card.innerHTML=
   '<div class="ph" '+(r.img?'style="background-image:url(\''+r.img+'\')"':'')+'>'
   +'<span class="tag '+r.b+'">'+r.b+'</span>'
   +'<span class="pc'+(pw?' warn':'')+'">'+(r.photos!=null?r.photos+(r.photos==1?' photo':' photos'):'—')+'</span>'
   +'</div>'
   +'<div class="bd">'
   +'<div class="price">'+money(r.price)+'</div>'
   +'<div class="addr">'+r.addr+'</div><div class="city">'+r.city+'</div>'
   +'<div class="facts">'+facts.join('')+'</div>'
   +'<div class="kws">'+kws+'</div>'
   +'<div class="mlab"><span>Buyer interest: '+ml+'</span><span>'+(r.sv==null?'':(r.sv*100).toFixed(1)+'% sv · '+(r.views||0)+' views')+'</span></div>'
   +'<div class="meter"><i style="width:'+pct+'%;background:'+mc+'"></i></div>'
   +'<a class="btn" target="_blank" rel="noopener" href="'+r.url+'">View on Zillow ↗</a>'
   +'</div>';
  g.appendChild(card);
  if(!r.img){const ph=card.querySelector('.ph');fallbackImg(ph,r.addr+' '+r.city);}
 }
}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.dataset.on='0');c.dataset.on='1';filter=c.dataset.f;render();});
document.getElementById('q').addEventListener('input',render);
document.getElementById('sort').addEventListener('change',render);
const cnt={all:DATA.length,fresh:0,stale:0,other:0};DATA.forEach(r=>cnt[r.b]++);
cAll.textContent=cnt.all;cFresh.textContent=cnt.fresh;cStale.textContent=cnt.stale;cOther.textContent=cnt.other;
render();
</script></body></html>
